<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>投诉栏 · 小鲨鱼小鱼小熊家庭十年成长计划</title>
<link rel="icon" href="icon.webp">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #eaf6ff; min-height: 100dvh; background: linear-gradient(180deg, #062a4d 0%, #041c36 55%, #02101f 100%); padding: 0 14px 44px; }
  .wrap { max-width: 540px; margin: 0 auto; }
  .hero { margin: 0 -14px 14px; height: 132px; background: url('hero.jpg') center 62% / cover no-repeat; position: relative; }
  .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4,24,46,.08), rgba(4,24,46,.55)); }
  .brand { display: flex; align-items: center; gap: 10px; margin: 2px 0 14px; }
  .brand img { width: 40px; height: 40px; border-radius: 11px; box-shadow: 0 6px 16px rgba(0,0,0,.4); }
  .brand .name { font-size: 13px; color: #9fd4f5; line-height: 1.5; }
  .brand .name b { color: #eaf6ff; font-size: 14px; }
  .brand a.back { margin-left: auto; flex: none; font-size: 12.5px; color: #6ee7ff; text-decoration: none; border: 1px solid rgba(140,220,255,.4); padding: 7px 13px; border-radius: 999px; }
  h1 { font-size: 21px; text-align: center; letter-spacing: 6px; margin: 4px 0 16px; color: #f2faff; text-shadow: 0 2px 16px rgba(70,180,255,.4); }
  .card { background: linear-gradient(165deg, rgba(16,68,116,.55), rgba(7,36,66,.72)); border: 1px solid rgba(140,220,255,.22); border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 14px 30px rgba(0,0,0,.35); }
  .flabel { font-size: 13px; color: #9fd4f5; margin: 4px 0 9px; letter-spacing: 1px; }
  .chips { display: flex; gap: 8px; margin-bottom: 14px; }
  .chips button { flex: 1; padding: 11px 0; font-size: 15px; border-radius: 11px; cursor: pointer; color: #bfe6ff; background: rgba(110,231,255,.06); border: 1px solid rgba(140,220,255,.3); }
  .chips button.active { background: linear-gradient(145deg, #0e5a8a, #083a5e); color: #fff; border-color: rgba(160,225,255,.7); box-shadow: 0 6px 18px rgba(14,90,138,.45); }
  textarea { width: 100%; font-size: 15.5px; line-height: 1.6; padding: 12px; border-radius: 11px; background: rgba(3,20,40,.65); border: 1px solid rgba(140,220,255,.35); color: #fff; resize: vertical; min-height: 88px; font-family: inherit; }
  textarea::placeholder { color: rgba(159,212,245,.5); }
  .btn { width: 100%; margin-top: 12px; padding: 13px; font-size: 16px; border: none; border-radius: 11px; background: linear-gradient(145deg, #1283b8, #0a5d8f); color: #fff; cursor: pointer; font-weight: 700; box-shadow: 0 8px 18px rgba(10,93,143,.4); }
  .btn:active { opacity: .85; }
  .msg { min-height: 18px; font-size: 13px; color: #ffd166; margin-top: 9px; text-align: center; }
  .board h2 { font-size: 16px; margin-bottom: 4px; color: #f2faff; letter-spacing: 2px; }
  .board .tip { font-size: 12px; color: rgba(159,212,245,.6); margin-bottom: 6px; }
  .post { padding: 13px 0; border-top: 1px dashed rgba(140,220,255,.18); }
  .post:first-of-type { border-top: none; }
  .post .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .tag { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid rgba(255,209,102,.55); color: #ffd166; }
  .tag.who { border-color: rgba(140,220,255,.5); color: #a5e3ff; }
  .post .when { font-size: 12px; color: rgba(159,212,245,.55); margin-left: auto; }
  .post .body { font-size: 15px; line-height: 1.65; word-break: break-all; }
  .post .del { margin-top: 8px; font-size: 12.5px; color: #ffb4a2; background: none; border: 1px solid rgba(255,180,162,.4); border-radius: 8px; padding: 4px 9px; cursor: pointer; }
  .post .del.confirm { background: #b3543f; color: #fff; border-color: #b3543f; }
  .empty { text-align: center; color: rgba(159,212,245,.6); font-size: 14px; padding: 16px 0 4px; }
  .foot { text-align: center; font-size: 12px; color: rgba(159,212,245,.55); line-height: 1.8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"></div>
  <div class="brand">
    <img src="icon.webp" alt="虎鲸图标">
    <div class="name"><b>小鲨鱼 · 小鱼 · 小熊</b><br>家庭十年成长计划</div>
    <a class="back" href="index.html">← 回到书里</a>
  </div>

  <h1>投 诉 栏</h1>

  <div class="card">
    <div class="flabel">被投诉人（选一个）</div>
    <div class="chips" id="whoChips"></div>
    <div class="flabel">投诉原因（选一个）</div>
    <div class="chips" id="whyChips"></div>
    <div class="flabel">投诉内容</div>
    <textarea id="content" maxlength="500" placeholder="把想投诉的事写在这里，贴到公告板上不记名……"></textarea>
    <button class="btn" id="submitBtn">匿名贴到公告板</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card board">
    <h2>公 告 板</h2>
    <div class="tip">全部匿名：只显示被投诉人、原因和内容，永远不显示是谁投诉的。</div>
    <div id="board"></div>
  </div>

  <div class="foot">公告板存在家庭服务器上，三个人在各自手机上看到的是同一面公告板。</div>
</div>

<script>
  var API = '__API_BASE__';
  var WHOS = ['白熊', '鲨鱼', '暮鱼'];
  var WHYS = ['情感', '工作', '认知'];
  var who = '', why = '';
  var items = [];
  var confirmId = null, confirmTimer = null;
  var boardEl = document.getElementById('board');
  var msgEl = document.getElementById('msg');

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function msg(t) { msgEl.textContent = t || ''; }
  function fmtTime(t) {
    var d = new Date(t);
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function buildChips(elId, values, get, set) {
    var el = document.getElementById(elId);
    el.innerHTML = values.map(function (v) {
      return '<button type="button" data-v="' + v + '" class="' + (get() === v ? 'active' : '') + '">' + v + '</button>';
    }).join('');
    el.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-v]'); if (!b) return;
      set(b.getAttribute('data-v'));
      el.querySelectorAll('button').forEach(function (x) { x.classList.toggle('active', x.getAttribute('data-v') === get()); });
    });
  }
  buildChips('whoChips', WHOS, function () { return who; }, function (v) { who = v; });
  buildChips('whyChips', WHYS, function () { return why; }, function (v) { why = v; });

  function render() {
    if (!items.length) { boardEl.innerHTML = '<div class="empty">公告板还空着，没有投诉。</div>'; return; }
    boardEl.innerHTML = items.map(function (x) {
      var del = confirmId === x.id
        ? '<button class="del confirm" data-del="' + x.id + '">再点一次确认删除</button>'
        : '<button class="del" data-del="' + x.id + '">删除</button>';
      return '<div class="post"><div class="meta">' +
        '<span class="tag who">被投诉：' + esc(x.target) + '</span>' +
        '<span class="tag">' + esc(x.reason) + '</span>' +
        '<span class="when">' + fmtTime(x.time) + '</span></div>' +
        '<div class="body">' + esc(x.text) + '</div>' + del + '</div>';
    }).join('');
  }

  function call(opts) {
    return fetch(API + '/api/complaints', opts).then(function (r) { return r.json(); }).then(function (d) {
      if (d.ok) { items = d.items; render(); } else { msg('服务器没应答，请稍后重试'); }
    }).catch(function () { msg('连不上服务器，检查网络后再试'); });
  }
  function load() { call({}); }

  document.getElementById('submitBtn').addEventListener('click', function () {
    var text = document.getElementById('content').value.trim();
    if (!who) { msg('先选被投诉人'); return; }
    if (!why) { msg('再选投诉原因'); return; }
    if (!text) { msg('投诉内容还没写'); return; }
    msg('');
    fetch(API + '/api/complaints', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ target: who, reason: why, text: text }) })
      .then(function (r) { return r.json(); }).then(function (d) {
        if (d.ok) {
          items = d.items; render();
          document.getElementById('content').value = '';
          msg('已匿名贴到公告板');
        } else { msg('没贴上，请稍后重试'); }
      }).catch(function () { msg('连不上服务器，检查网络后再试'); });
  });

  boardEl.addEventListener('click', function (ev) {
    var del = ev.target.closest('[data-del]'); if (!del) return;
    var id = del.getAttribute('data-del');
    if (confirmId === id) {
      confirmId = null;
      call({ method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id }) });
    } else {
      confirmId = id; render();
      clearTimeout(confirmTimer);
      confirmTimer = setTimeout(function () { confirmId = null; render(); }, 2500);
    }
  });

  render();
  load();
</script>
</body>
</html>
