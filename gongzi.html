<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>工资条 · 小鲨鱼小鱼小熊家庭十年成长计划</title>
<link rel="icon" href="icon.webp">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #eaf6ff; min-height: 100dvh;
    background: linear-gradient(180deg, #062a4d 0%, #041c36 55%, #02101f 100%);
    padding: 0 14px 44px;
  }
  .wrap { max-width: 540px; margin: 0 auto; }
  .hero { margin: 0 -14px 14px; height: 132px; background: url('hero.jpg') center 62% / cover no-repeat; position: relative; }
  .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4,24,46,.08), rgba(4,24,46,.55)); }
  .brand { display: flex; align-items: center; gap: 10px; margin: 2px 0 14px; }
  .brand img { width: 40px; height: 40px; border-radius: 11px; box-shadow: 0 6px 16px rgba(0,0,0,.4); }
  .brand .name { font-size: 13px; color: #9fd4f5; letter-spacing: .5px; line-height: 1.5; }
  .brand .name b { color: #eaf6ff; font-size: 14px; }
  .brand a.back { margin-left: auto; flex: none; font-size: 12.5px; color: #6ee7ff; text-decoration: none; border: 1px solid rgba(140,220,255,.4); padding: 7px 13px; border-radius: 999px; }
  h1 { font-size: 21px; text-align: center; letter-spacing: 6px; margin: 4px 0 16px; color: #f2faff; text-shadow: 0 2px 16px rgba(70,180,255,.4); }
  .months { display: flex; gap: 8px; margin-bottom: 14px; }
  .months button {
    flex: 1; padding: 11px 0; font-size: 14.5px; border-radius: 11px; cursor: pointer;
    color: #bfe6ff; background: rgba(110,231,255,.06); border: 1px solid rgba(140,220,255,.3);
  }
  .months button.active { background: linear-gradient(145deg, #0e5a8a, #083a5e); color: #fff; border-color: rgba(160,225,255,.7); box-shadow: 0 6px 18px rgba(14,90,138,.45); }
  .card {
    background: linear-gradient(165deg, rgba(16,68,116,.55), rgba(7,36,66,.72));
    border: 1px solid rgba(140,220,255,.22); border-radius: 16px; padding: 18px 16px; margin-bottom: 14px;
    box-shadow: 0 14px 30px rgba(0,0,0,.35);
  }
  .label { font-size: 13px; color: #9fd4f5; text-align: center; letter-spacing: 1px; }
  .balance { font-size: 44px; font-weight: 800; text-align: center; margin: 8px 0 5px; font-variant-numeric: tabular-nums; color: #ffffff; text-shadow: 0 3px 20px rgba(110,231,255,.35); }
  .sub { font-size: 13px; color: #9fd4f5; text-align: center; }
  .row { display: flex; gap: 8px; }
  input[type=number] {
    flex: 1; font-size: 17px; padding: 12px; border-radius: 11px; min-width: 0;
    background: rgba(3,20,40,.65); border: 1px solid rgba(140,220,255,.35); color: #fff;
  }
  input[type=number]::placeholder { color: rgba(159,212,245,.5); font-size: 15px; }
  .btn { padding: 12px 18px; font-size: 16px; border: none; border-radius: 11px; background: linear-gradient(145deg, #1283b8, #0a5d8f); color: #fff; cursor: pointer; white-space: nowrap; font-weight: 700; box-shadow: 0 8px 18px rgba(10,93,143,.4); }
  .btn:active { opacity: .85; }
  .btn-all { background: rgba(110,231,255,.08); color: #6ee7ff; border: 1px solid rgba(140,220,255,.45); box-shadow: none; font-weight: 600; padding: 12px; }
  .msg { min-height: 20px; font-size: 13px; color: #ffd166; margin-top: 9px; text-align: center; }
  .detail h2 { font-size: 15px; margin-bottom: 6px; color: #eaf6ff; }
  .item { display: flex; align-items: center; padding: 11px 0; border-top: 1px dashed rgba(140,220,255,.18); }
  .item .when { flex: 1; font-size: 14px; color: #bfe6ff; }
  .item .amt { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; color: #fff; }
  .item .del { margin-left: 10px; font-size: 13px; color: #ffb4a2; background: none; border: 1px solid rgba(255,180,162,.4); border-radius: 8px; padding: 5px 9px; cursor: pointer; }
  .item .del.confirm { background: #b3543f; color: #fff; border-color: #b3543f; }
  .empty { text-align: center; color: rgba(159,212,245,.6); font-size: 14px; padding: 18px 0 6px; }
  .foot { text-align: center; font-size: 12px; color: rgba(159,212,245,.55); margin-top: 10px; line-height: 1.8; }
  #gate { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 22px; background: linear-gradient(180deg, #062a4d, #02101f); }
  #gate .gcard { width: 100%; max-width: 340px; text-align: center; background: linear-gradient(165deg, rgba(16,68,116,.55), rgba(7,36,66,.8)); border: 1px solid rgba(140,220,255,.25); border-radius: 18px; padding: 30px 22px 24px; box-shadow: 0 20px 44px rgba(0,0,0,.5); }
  #gate img { width: 74px; height: 74px; border-radius: 19px; margin-bottom: 16px; }
  #gate .gt { font-size: 16px; letter-spacing: 2px; color: #eaf6ff; margin-bottom: 16px; }
  #gate .grow { display: flex; gap: 8px; }
  #gate input { flex: 1; min-width: 0; font-size: 15px; padding: 11px; border-radius: 10px; background: rgba(3,20,40,.7); border: 1px solid rgba(140,220,255,.35); color: #fff; }
  #gate button { padding: 11px 18px; font-size: 15px; border: none; border-radius: 10px; background: linear-gradient(145deg, #1283b8, #0a5d8f); color: #fff; cursor: pointer; font-weight: 700; }
  #gate .gmsg { min-height: 17px; font-size: 12.5px; color: #ffd166; margin-top: 10px; }
  #gate a { display: inline-block; margin-top: 12px; font-size: 12.5px; color: #9fd4f5; }
</style>
</head>
<body>
<div id="gate" style="display:none">
  <div class="gcard">
    <img src="icon.webp" alt="虎鲸图标">
    <div class="gt">请输入特殊编码</div>
    <div class="grow">
      <input id="gateInput" type="text" placeholder="请输入特殊编码" autocomplete="off">
      <button id="gateGo">进入</button>
    </div>
    <div class="gmsg" id="gateMsg"></div>
    <a href="index.html">← 回到书里</a>
  </div>
</div>
<div class="wrap">
  <div class="hero"></div>
  <div class="brand">
    <img src="icon.webp" alt="虎鲸图标">
    <div class="name"><b>小鲨鱼 · 小鱼 · 小熊</b><br>家庭十年成长计划</div>
    <a class="back" href="index.html">← 回到书里</a>
  </div>

  <h1>工 资 条</h1>
  <div class="months" id="months"></div>

  <div class="card">
    <div class="label" id="balLabel">本月余额</div>
    <div class="balance" id="balance">¥3,000.00</div>
    <div class="sub" id="balSub">固定工资 ¥3,000.00 · 已提现 ¥0.00</div>
  </div>

  <div class="card">
    <div class="row">
      <input type="number" id="amount" inputmode="decimal" min="0" step="0.01" placeholder="输入提现金额（元）">
      <button class="btn btn-all" id="allBtn">提全部</button>
      <button class="btn" id="withdrawBtn">提现</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card detail">
    <h2 id="detailTitle">提现明细</h2>
    <div id="list"></div>
  </div>

  <div class="foot">记录保存在这台设备的浏览器里，换设备不互通。</div>
</div>

<script>
var SALARY = 3000;
var MONTHS = [
  { key: '2026-11', label: '2026年11月' },
  { key: '2026-12', label: '2026年12月' },
  { key: '2027-01', label: '2027年1月' }
];
var STORE_KEY = 'gongzi-v1';
var data = {};
try { data = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { data = {}; }
MONTHS.forEach(function (m) { if (!Array.isArray(data[m.key])) data[m.key] = []; });

var now = new Date();
var nowKey = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
var current = MONTHS.some(function (m) { return m.key === nowKey; }) ? nowKey : MONTHS[0].key;
var pendingDelete = -1;

function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {} }
function fmt(n) { return '¥' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function monthLabel(key) { for (var i = 0; i < MONTHS.length; i++) if (MONTHS[i].key === key) return MONTHS[i].label; return key; }
function spent(key) { return data[key].reduce(function (s, r) { return s + r.amount; }, 0); }
function balance(key) { return SALARY - spent(key); }

function fmtWhen(ts) {
  var d = new Date(ts);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' +
    String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function render() {
  var box = document.getElementById('months');
  box.innerHTML = '';
  MONTHS.forEach(function (m) {
    var b = document.createElement('button');
    b.textContent = m.label;
    if (m.key === current) b.className = 'active';
    b.onclick = function () { current = m.key; pendingDelete = -1; setMsg(''); render(); };
    box.appendChild(b);
  });

  document.getElementById('balLabel').textContent = monthLabel(current) + ' · 本月余额';
  document.getElementById('balance').textContent = fmt(balance(current));
  document.getElementById('balSub').textContent =
    '固定工资 ' + fmt(SALARY) + ' · 已提现 ' + fmt(spent(current)) + ' · 共 ' + data[current].length + ' 笔';

  document.getElementById('detailTitle').textContent =
    monthLabel(current) + ' 提现明细（合计 ' + fmt(spent(current)) + '）';

  var list = document.getElementById('list');
  list.innerHTML = '';
  if (data[current].length === 0) {
    var e = document.createElement('div');
    e.className = 'empty';
    e.textContent = '这个月还没有提现记录';
    list.appendChild(e);
    return;
  }
  var rows = data[current].slice().reverse();
  rows.forEach(function (r) {
    var idx = data[current].indexOf(r);
    var div = document.createElement('div');
    div.className = 'item';
    var when = document.createElement('span');
    when.className = 'when';
    when.textContent = fmtWhen(r.ts);
    var amt = document.createElement('span');
    amt.className = 'amt';
    amt.textContent = '−' + fmt(r.amount);
    var del = document.createElement('button');
    del.className = 'del' + (pendingDelete === idx ? ' confirm' : '');
    del.textContent = pendingDelete === idx ? '确认删除' : '删除';
    del.onclick = function () {
      if (pendingDelete === idx) {
        data[current].splice(idx, 1);
        pendingDelete = -1;
        save();
        setMsg('已删除，金额退回余额');
        render();
      } else {
        pendingDelete = idx;
        render();
      }
    };
    div.appendChild(when); div.appendChild(amt); div.appendChild(del);
    list.appendChild(div);
  });
}

function setMsg(t) { document.getElementById('msg').textContent = t; }

document.getElementById('withdrawBtn').onclick = function () {
  var input = document.getElementById('amount');
  var v = parseFloat(input.value);
  if (isNaN(v) || v <= 0) { setMsg('先输入一个大于 0 的金额'); return; }
  v = Math.round(v * 100) / 100;
  var bal = balance(current);
  if (v > bal) { setMsg('这个月只剩 ' + fmt(bal) + '，提现金额超过余额了'); return; }
  data[current].push({ amount: v, ts: Date.now() });
  save();
  input.value = '';
  pendingDelete = -1;
  setMsg('已提现 ' + fmt(v));
  render();
};
document.getElementById('allBtn').onclick = function () {
  var bal = balance(current);
  document.getElementById('amount').value = bal > 0 ? bal : '';
  if (bal <= 0) setMsg('这个月已经提完了');
};

render();
</script>
<script>
  (function () {
    var unlocked = false;
    try { unlocked = sessionStorage.getItem('pay-unlocked') === '1'; } catch (e) {}
    if (unlocked) return;
    var gate = document.getElementById('gate');
    gate.style.display = 'flex';
    function tryCode() {
      var v = document.getElementById('gateInput').value.trim();
      if (v === 'muyuzuiniubi') {
        try { sessionStorage.setItem('pay-unlocked', '1'); } catch (e) {}
        gate.style.display = 'none';
      } else {
        document.getElementById('gateMsg').textContent = '编码不正确';
      }
    }
    document.getElementById('gateGo').addEventListener('click', tryCode);
    document.getElementById('gateInput').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') tryCode(); });
  })();
</script>
</body>
</html>
