<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小鲨鱼小鱼小熊家庭十年成长计划</title>
<link rel="icon" href="icon.webp">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #eaf6ff;
    background: #04182e url('hero.jpg') center / cover no-repeat fixed;
    overflow-x: hidden;
  }
  .shade { position: fixed; inset: 0; background: linear-gradient(180deg, rgba(3,20,40,.55), rgba(3,20,40,.78) 60%, rgba(2,12,26,.92)); pointer-events: none; }
  .bubbles { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .bubbles i {
    position: absolute; bottom: -4vh; border-radius: 50%;
    background: radial-gradient(circle at 32% 32%, rgba(190,240,255,.95), rgba(90,190,255,.25) 70%);
    opacity: .5; animation: rise linear infinite;
  }
  @keyframes rise { to { transform: translateY(-112vh) translateX(2vw); } }
  .stage { position: relative; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 18px 40px; }

  /* ---------- book ---------- */
  .book-wrap { perspective: 1600px; width: min(88vw, 350px); }
  .book { position: relative; width: 100%; aspect-ratio: 3 / 5.2; transform-style: preserve-3d; }
  .cover {
    position: absolute; inset: 0; border-radius: 10px 18px 18px 10px;
    background: linear-gradient(150deg, #0a3d66 0%, #062a4d 55%, #041c36 100%);
    border: 1px solid rgba(140,220,255,.35);
    box-shadow: 0 30px 60px rgba(0,0,0,.55), inset 0 0 0 6px rgba(120,205,255,.07), inset 14px 0 24px rgba(0,0,0,.35);
    transform-origin: left center; transition: transform 1.35s cubic-bezier(.6,.02,.2,1), opacity .5s ease .95s;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 26px 22px; text-align: center; cursor: pointer; z-index: 3; backface-visibility: hidden;
  }
  .book.open .cover { transform: rotateY(-158deg); opacity: 0; pointer-events: none; }
  .cover img.icon { width: 108px; height: 108px; border-radius: 26px; box-shadow: 0 10px 28px rgba(0,0,0,.45); }
  .cover .plan { font-size: 21px; font-weight: 700; line-height: 1.55; letter-spacing: 1px; color: #f2faff; text-shadow: 0 2px 14px rgba(70,180,255,.45); }
  .cover .plan em { font-style: normal; color: #ffd166; }
  .cover .members { font-size: 13px; color: #9fd4f5; letter-spacing: 3px; }
  .cover .tap { margin-top: 10px; font-size: 13px; color: #04182e; background: linear-gradient(90deg, #6ee7ff, #a5f3ff); padding: 9px 20px; border-radius: 999px; font-weight: 600; animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .pages {
    position: absolute; inset: 6px 6px 6px 10px; border-radius: 8px 14px 14px 8px;
    background: linear-gradient(160deg, rgba(10,52,92,.92), rgba(5,30,58,.96));
    border: 1px solid rgba(140,220,255,.25);
    padding: 18px 15px; display: flex; flex-direction: column; gap: 10px; justify-content: center;
    opacity: 0; transform: translateY(8px); transition: opacity .6s ease .55s, transform .6s ease .55s; z-index: 2;
  }
  .book.open .pages { opacity: 1; transform: none; }
  .pages .hello { text-align: center; font-size: 14px; color: #bfe6ff; line-height: 1.7; margin-bottom: 2px; }
  .pages .hello b { color: #ffd166; font-weight: 700; }
  a.entry {
    display: flex; align-items: center; gap: 12px; text-decoration: none; color: #eaf6ff;
    background: rgba(110,231,255,.07); border: 1px solid rgba(140,220,255,.28); border-radius: 14px; padding: 11px 13px;
  }
  a.entry:active { background: rgba(110,231,255,.16); }
  a.entry .thumb { width: 46px; height: 46px; border-radius: 12px; flex: none; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, #0e5a8a, #083a5e); border: 1px solid rgba(140,220,255,.35); }
  a.entry .t { font-size: 16px; font-weight: 700; }
  a.entry .d { font-size: 12px; color: #9fd4f5; margin-top: 3px; line-height: 1.55; }
  a.entry .go { margin-left: auto; color: #6ee7ff; font-size: 18px; flex: none; }
  .gate { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .gate .plus {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(140,220,255,.35);
    background: rgba(110,231,255,.05); color: rgba(159,212,245,.75); font-size: 19px; line-height: 1; cursor: pointer;
  }
  .gate .plus:active { background: rgba(110,231,255,.18); }
  .codebox { width: 100%; background: rgba(3,20,40,.55); border: 1px solid rgba(140,220,255,.25); border-radius: 12px; padding: 12px; }
  .codetitle { font-size: 13px; color: #9fd4f5; text-align: center; margin-bottom: 9px; letter-spacing: 1px; }
  .coderow { display: flex; gap: 8px; }
  .coderow input { flex: 1; min-width: 0; font-size: 15px; padding: 9px 11px; border-radius: 9px; background: rgba(3,20,40,.7); border: 1px solid rgba(140,220,255,.35); color: #fff; }
  .coderow button { padding: 9px 16px; font-size: 14px; border: none; border-radius: 9px; background: linear-gradient(145deg, #1283b8, #0a5d8f); color: #fff; cursor: pointer; font-weight: 700; }
  .codemsg { min-height: 16px; font-size: 12px; color: #ffd166; text-align: center; margin-top: 7px; }
  .foot { margin-top: 26px; font-size: 12px; color: rgba(190,228,255,.55); text-align: center; line-height: 1.8; position: relative; }
  .reopen { margin-top: 14px; font-size: 12px; color: #9fd4f5; background: none; border: 1px solid rgba(140,220,255,.35); padding: 7px 16px; border-radius: 999px; cursor: pointer; display: none; position: relative; }
  .book.open ~ .reopen { display: inline-block; }
</style>
</head>
<body>
<div class="shade"></div>
<div class="bubbles" id="bubbles"></div>

<div class="stage">
  <div class="book-wrap">
    <div class="book" id="book">
      <div class="pages">
        <div class="hello">欢迎来到我们的海。<br>选一个，<b>开始今天</b>。</div>
        <a class="entry" href="richeng.html">
          <span class="thumb" aria-hidden="true">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="3" stroke="#6ee7ff" stroke-width="1.6"/><path d="M3 10h18" stroke="#6ee7ff" stroke-width="1.6"/><path d="M8 3v4M16 3v4" stroke="#6ee7ff" stroke-width="1.6" stroke-linecap="round"/><path d="M8.5 16.5l2.4 2.4 4.6-4.9" stroke="#ffd166" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span>
            <span class="t">每日打勾日程</span>
            <span class="d" style="display:block">每天 9 项，划动换日期，满勤得一颗小星星。</span>
          </span>
          <span class="go">›</span>
        </a>
        <a class="entry" href="gongzi.html" id="payEntry" style="display:none">
          <span class="thumb" aria-hidden="true">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="3" stroke="#6ee7ff" stroke-width="1.6"/><path d="M3 10h18" stroke="#6ee7ff" stroke-width="1.6"/><path d="M7 15.5h5" stroke="#ffd166" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
          <span>
            <span class="t">工资条 · 子界面</span>
            <span class="d" style="display:block">每月固定 ¥3,000，点开进入子界面记提现。</span>
          </span>
          <span class="go">›</span>
        </a>
        <div class="gate" id="payGate">
          <button class="plus" id="plusBtn" aria-label="展开">+</button>
          <div class="codebox" id="codeBox" style="display:none">
            <div class="codetitle">请输入特殊编码</div>
            <div class="coderow">
              <input id="codeInput" type="text" placeholder="请输入特殊编码" autocomplete="off">
              <button id="codeGo">进入</button>
            </div>
            <div class="codemsg" id="codeMsg"></div>
          </div>
        </div>
        <a class="entry" href="todo.html">
          <span class="thumb" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 3.6l2.5 5.1 5.6.8-4 4 1 5.6-5.1-2.7-5.1 2.7 1-5.6-4-4 5.6-.8L12 3.6z" stroke="#ffd166" stroke-width="1.5" stroke-linejoin="round"/><path d="M9.3 12.6l2 2 3.6-3.9" stroke="#6ee7ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span>
            <span class="t">关键待办</span>
            <span class="d" style="display:block">手动输入待办，生成打勾框，做完勾掉。</span>
          </span>
          <span class="go">›</span>
        </a>
        <a class="entry" href="tousu.html">
          <span class="thumb" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M4 10v4h3l7 5V5l-7 5H4z" stroke="#6ee7ff" stroke-width="1.6" stroke-linejoin="round"/><path d="M17.5 9.5a4 4 0 010 5" stroke="#ffd166" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <span>
            <span class="t">投诉栏 · 公告板</span>
            <span class="d" style="display:block">选被投诉人和原因，匿名贴上公告板。</span>
          </span>
          <span class="go">›</span>
        </a>
      </div>
      <div class="cover" id="cover" role="button" aria-label="翻开这本书">
        <img class="icon" src="icon.webp" alt="虎鲸图标">
        <div class="plan">小鲨鱼 · 小鱼 · 小熊<br>家庭<em>十年成长计划</em></div>
        <div class="members">一 片 海 · 十 年</div>
        <div class="tap">翻 开 这 本 书</div>
      </div>
    </div>
    <button class="reopen" id="reopen">合上书</button>
  </div>
  <div class="foot">深蓝的海，慢慢长大。<br>日程与工资条都在这本书里。</div>
</div>

<script>
  (function () {
    var API = '__API_BASE__';
    var entry = document.getElementById('payEntry');
    var gate = document.getElementById('payGate');
    function unlock() { entry.style.display = ''; gate.style.display = 'none'; }
    var hasToken = false;
    try { hasToken = !!sessionStorage.getItem('pay-token'); } catch (e) {}
    if (hasToken) { unlock(); return; }
    document.getElementById('plusBtn').addEventListener('click', function () {
      document.getElementById('codeBox').style.display = '';
      document.getElementById('codeInput').focus();
    });
    function tryCode() {
      var v = document.getElementById('codeInput').value.trim();
      var msgEl = document.getElementById('codeMsg');
      fetch(API + '/api/unlock', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: v }) })
        .then(function (r) { return r.json(); }).then(function (d) {
          if (d.ok && d.token) {
            try { sessionStorage.setItem('pay-token', d.token); } catch (e) {}
            unlock();
          } else { msgEl.textContent = '编码不正确'; }
        }).catch(function () { msgEl.textContent = '连不上服务器，检查网络后再试'; });
    }
    document.getElementById('codeGo').addEventListener('click', tryCode);
    document.getElementById('codeInput').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') tryCode(); });
  })();
  var book = document.getElementById('book');
  document.getElementById('cover').addEventListener('click', function () { book.classList.add('open'); });
  document.getElementById('reopen').addEventListener('click', function () { book.classList.remove('open'); });
  var box = document.getElementById('bubbles');
  for (var i = 0; i < 16; i++) {
    var b = document.createElement('i');
    var s = 3 + Math.random() * 9;
    b.style.width = s + 'px'; b.style.height = s + 'px';
    b.style.left = (Math.random() * 100) + 'vw';
    b.style.animationDuration = (9 + Math.random() * 14) + 's';
    b.style.animationDelay = (-Math.random() * 16) + 's';
    box.appendChild(b);
  }
</script>
</body>
</html>
